name: Deploy Application

on:
  push:
    branches:
      - feat/tma

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Cache pnpm modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install dependencies
      run: |
        cd frontend
        npm install -g pnpm
        pnpm install

    - name: Build frontend
      run: |
        cd frontend
        pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USENAME }}@${{ secrets.VPS_IP }} << 'EOF'
          cd ~/octagate-bot
          git pull
          make build && make migrate && make restart
        EOF