x-python-service:
  &x-python-service
  depends_on:
    redis:
      condition: service_healthy
    mysql:
      condition: service_healthy
  networks:
    - internal


services:
  transaction-lookup:
    build:
      context: transaction-lookup
      dockerfile: build/Dockerfile.worker
    env_file:
      - ./transaction-lookup/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  indexer:
    <<: *x-python-service
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: indexer
    image: octagate-indexer
    env_file:
      - indexer/config/.env
      - ./core/config/.env
    restart: on-failure
    command: [
      "celery",
      "-A",
      "indexer.celery_app:app",
      "worker",
      "-Q",
      "wallet-fetch-queue",
      "--loglevel=info"
    ]
    environment:
      - WORKER_CONCURRENCY=8
    volumes:
      - ./core:/app/core
      - ./indexer:/app/indexer

  load-noticed-wallets:
    <<: *x-python-service
    image: octagate-indexer
    env_file:
      - indexer/config/.env
      - ./core/config/.env
    restart: on-failure
    command: [
      "celery",
      "-A",
      "indexer.celery_app:app",
      "worker",
      "-Q",
      "noticed-wallets-upload-queue",
      "--loglevel=info"
    ]
    environment:
      - WORKER_CONCURRENCY=1
      - LOAD_WALLETS=1
    volumes:
      - ./core:/app/core
      - ./indexer:/app/indexer

  community-manager-tasks:
    <<: *x-python-service
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: community-manager
    image: octagate-community-manager
    env_file:
      - ./community_manager/config/.env
      - ./core/config/.env
    command: [
      "celery",
      "-A",
      "community_manager.celery_app:app",
      "worker",
      "-Q",
      "system-queue",
      "--loglevel=info"
    ]
    volumes:
      - ./community_manager:/app/community_manager

  community-manager:
    <<: *x-python-service
    image: octagate-community-manager
    env_file:
      - ./community_manager/config/.env
      - ./core/config/.env
    command: ["python3", "community_manager/entrypoint.py"]
    volumes:
      - ./community_manager:/app/community_manager

  scheduler:
    <<: *x-python-service
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: scheduler
    image: octagate-scheduler
    env_file:
      - ./community_manager/config/.env
      - ./core/config/.env
    command: [
      "celery",
      "-A",
      "scheduler.celery_app:app",
      "beat",
      "--loglevel=info"
    ]
    volumes:
      - ./scheduler:/app/scheduler
      - ./community_manager:/app/community_manager
      - ./core:/app/core

  api:
    <<: *x-python-service
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: api
    image: octagate-api
    env_file:
      - ./api/config/.env
      - ./core/config/.env
      - ./config/.env
    container_name: "octagate-api"
    ports:
      - "8000:8000"
    volumes:
      - ./core/static:/app/core/static
      - volume-public:/app/core/static:rw
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  redis:
    image: "redis:7.2.4-alpine"
    ports:
      - "6380:6379"
    volumes:
      - volume-queue:/data
    container_name: "octagate-redis"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  mysql:
    image: "mysql:8.3.0"
    ports:
      - "3307:3306"
    env_file:
      - core/config/.env
    volumes:
      - volume-data:/var/lib/mysql
    container_name: "octagate-mysql"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  frontend:
    image: ghcr.io/danoctua/octagate-frontend:latest
    container_name: "octagate-frontend"
    env_file:
      - ./config/.env
    ports:
      - "3000:3000"
    volumes:
      - ./config/.env:/app/.env
      - volume-public:/app/public/dynamic:ro
    networks:
      - internal

volumes:
  volume-data:
  volume-queue:
  volume-public:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./core/static
  community-manager-session:
  community-manager-tasks-session:


networks:
  internal:
